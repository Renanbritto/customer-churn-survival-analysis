name: R Statistical Quality & Test Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test & Validate (R ${{ matrix.r-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        r-version: ['release']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Set up R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::lintr

      - name: Execute testthat Unit Tests
        run: |
          Rscript -e '
            library(testthat)
            r_files <- list.files("R", pattern = "\\.R$", full.names = TRUE)
            for (f in r_files) source(f)
            test_results <- test_dir("tests/testthat", reporter = "summary")
            if (any(as.data.frame(test_results)$failed > 0)) {
              stop("One or more unit tests failed!")
            }
          '